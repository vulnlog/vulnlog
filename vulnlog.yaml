  - id: CVE-2026-14456
    description: Unbounded memory growth in the OpenSSL QUIC server listener enables a remote denial of service.
    releases: [0.17.0]
    packages:
      - "pkg:deb/debian/libssl3t64@3.5.6-1~deb13u2"
      - "pkg:deb/debian/openssl-provider-legacy@3.5.6-1~deb13u2"
    reports:
      - reporter: trivy
        at: 2026-09-12
    tags: [container]
    analysis: >-
      OpenSSL sits in the image as a Debian base package; the Vulnlog binary links only libc and libz, so libssl is never loaded.
      Vulnlog is an offline CLI that reads and writes local files, opens no sockets, and therefore runs no QUIC listener that
      an attacker could flood with Initial packets.
    analyzed_at: 2026-09-12
    verdict: not affected
    justification: vulnerable code not in execute path
    resolution:
      in: 0.18.0
      at: 2026-09-29
      note: The Alpine base image ships OpenSSL 3.5.8, which contains the fix.
    comment: Fixed in OpenSSL 3.5.7.

