vulnerabilities:

  - id: CVE-2026-68497
    description: >-
      jackson-databind parses unbounded numbers when deserializing `Duration` and `XMLGregorianCalendar`, which exhausts CPU.
    aliases: [GHSA-q4xh-88c3-wmh7]
    releases: [0.14.0]
    packages: ["pkg:maven/com.fasterxml.jackson.core/jackson-databind@2.14.2"]
    reports:
      - reporter: github-dependabot
        at: 2026-09-28
        vuln_ids: [GHSA-q4xh-88c3-wmh7]
    tags: [dev dependency]
    analysis: >-
      Jackson 2.14.2 enters only the build classpath, through the Gradle Node plugin that runs the local docs build, and no release
      artifact ships it. The plugin calls Jackson only to read `package.json` metadata on request, which this build never does,
      and the repository has no `package.json`.
    analyzed_at: 2026-10-10
    verdict: not affected
    justification: vulnerable code not in execute path
    comment: Waits for a gradle-node-plugin release that ships a fixed Jackson 2.

