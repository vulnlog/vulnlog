  - id: CVE-2026-85091
    description: >-
      Heap buffer overflow in zlib `gz_vacate()` when `gzprintf()` follows a stalled non-blocking `gzwrite()`.
    releases: [0.17.0]
    packages:
      - "pkg:deb/debian/zlib1g@1.3.dfsg+really1.3.1-1+b1"
      - "pkg:apk/alpine/zlib@1.3.2-r0"
    reports:
      - reporter: trivy
        at: 2026-10-10
    tags: [container]
    analysis: >-
      The Vulnlog binary links zlib, but imports only the `inflate`, `deflate` and `crc32` routines behind `java.util.zip` and
      no `gz*` function. The overflow needs `gzprintf()` or `gzvprintf()` after a stalled non-blocking `gzwrite()`, which Vulnlog
      never calls.
    analyzed_at: 2026-10-10
    verdict: not affected
    justification: vulnerable code not in execute path
    comment: Alpine ships the fix in zlib 1.3.2-r1; the next base image bump picks it up.

  - id: CVE-2026-84782
    description: OpenSSL DTLS handshake retransmission can leak heap memory to the peer or crash.
    releases: [0.17.0]
    packages:
      - "pkg:deb/debian/libssl3t64@3.5.6-1~deb13u2"
      - "pkg:deb/debian/openssl-provider-legacy@3.5.6-1~deb13u2"
      - "pkg:apk/alpine/libssl3@3.5.8-r0"
      - "pkg:apk/alpine/libcrypto3@3.5.8-r0"
    reports:
      - reporter: trivy
        at: 2026-10-09
    tags: [container]
    analysis: >-
      OpenSSL sits in the image as a base package; the Vulnlog binary links only libc and libz, so libssl is never loaded. Vulnlog
      is an offline CLI that opens no sockets and speaks no DTLS.
    analyzed_at: 2026-10-10
    verdict: not affected
    justification: vulnerable code not in execute path
    comment: Upstream fixed it after OpenSSL 3.5.8, the version the 0.18.0 image ships.

  - id: CVE-2026-103111
    description: Out-of-bounds write in PCRE2 JIT matching with an attacker-controlled regular expression.
    releases: [0.17.0]
    packages: ["pkg:deb/debian/libpcre2-8-0@10.46-1~deb13u1"]
    reports:
      - reporter: trivy
        at: 2026-10-09
    tags: [container]
    analysis: >-
      PCRE2 enters the image through the Debian base only; the entrypoint is the Vulnlog native binary, which links just libc
      and libz and never loads libpcre2. Nothing in the container compiles or matches PCRE2 patterns.
    analyzed_at: 2026-10-10
    verdict: not affected
    justification: vulnerable code not in execute path
    resolution:
      in: 0.18.0
      at: 2026-09-12
      note: The Alpine base image carries no PCRE2.

