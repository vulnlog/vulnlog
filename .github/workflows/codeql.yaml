name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # New queries find issues in unchanged code too.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyse:
    name: Analyse Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JVM toolchain
        uses: ./.github/actions/setup-jvm
      # Kotlin has no `build-mode: none`. CodeQL reads the code while Gradle compiles it.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
      # CodeQL analyses only what the build compiles. Without the build cache every compile task runs.
      - name: Compile
        run: ./gradlew testClasses --no-build-cache
      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin
