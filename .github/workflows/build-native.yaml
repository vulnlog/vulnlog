name: Build native image

on:
  workflow_call:
    inputs:
      os:
        description: "Runner OS for the native build."
        type: string
        default: ubuntu-latest
      artifact-name:
        description: "Name to give the uploaded native-image artifact."
        type: string
        default: vulnlog-linux-amd64
      app-version:
        description: "Version passed as -PappVersion. Accepts a leading 'v' (e.g. github.ref_name) and strips it."
        type: string
        default: ''
      retention-days:
        description: "Artifact retention in days."
        type: number
        default: 7

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build native image
        shell: bash
        env:
          APP_VERSION_INPUT: ${{ inputs.app-version }}
        run: |
          VERSION="${APP_VERSION_INPUT#v}"
          TASKS=(:cli-app:nativeCompile)
          # One SBOM covers all platforms: the binaries share the lockfile and the GraalVM release.
          if [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ARCH" = X64 ]; then
            TASKS+=(:cli-app:cyclonedxNativeBom)
          fi
          if [ -n "$VERSION" ]; then
            ./gradlew "${TASKS[@]}" --no-configuration-cache -PappVersion="$VERSION"
          else
            ./gradlew "${TASKS[@]}" --no-configuration-cache
          fi
      - name: Upload native image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: modules/cli-app/build/native/nativeCompile/vulnlog${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: ${{ inputs.retention-days }}
      - name: Upload native image SBOM
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.artifact-name }}
          path: modules/cli-app/build/sbom/vulnlog-native-*.cdx.json
          retention-days: ${{ inputs.retention-days }}
