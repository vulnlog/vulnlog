name: Deploy website and docs

# Single implementation of the website deploy. Invoked four ways:
# - workflow_call from release.yaml on final release tags
# - workflow_dispatch for manual deploys from main
# - workflow_run after the weekly security scan, to refresh the bundled reports
# - push to main changing .vex/, so updated VEX documents go live without waiting for the next scan

on:
  push:
    branches: [main]
    paths: ['.vex/**']
  workflow_call:
    inputs:
      version:
        description: "Vulnlog version rendered into the website and install script. Defaults to vulnlog-version from docs/antora.yml."
        type: string
        default: ''
  workflow_dispatch:
  workflow_run:
    workflows: ["Security Scanning"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: website
      url: https://vulnlog.dev
    concurrency:
      group: website
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Build Antora docs
        run: npx antora antora-playbook.yml
      - name: Resolve security report run id
        id: report-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run-id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=security.yml \
            --status=success \
            --branch=main \
            --limit=1 \
            --json databaseId \
            -q '.[0].databaseId' || true)
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful security run found; skipping report bundle."
            echo "run-id=" >> "$GITHUB_OUTPUT"
          else
            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          fi
      - name: Download latest security reports
        if: steps.report-run.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: reports
          path: _report
          run-id: ${{ steps.report-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose site
        env:
          VERSION_INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name 2>/dev/null || true)
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(awk -F"'" '/vulnlog-version:/{print $2; exit}' docs/antora.yml)
          fi
          mkdir -p _site/docs _site/schema _site/vex
          cp -r website/index.html website/css website/favicon.ico website/img website/robots.txt website/sitemap.xml website/.well-known website/bunnycdn_errors _site/
          cp -r build/docs/* _site/docs/
          # Also served at /docs, where the relative redirect would resolve against /.
          sed -i 's|<meta charset="utf-8">|&<base href="/docs/">|' _site/docs/index.html
          cp schema/*.json _site/schema/
          cp .vex/*.json _site/vex/
          if [ -f _report/vulnlog-impact-report.html ]; then
            cp _report/vulnlog-impact-report.html _site/security-report.html
          else
            echo "Skipping impact report bundle (no artifact downloaded)."
          fi
          if [ -f _report/vulnlog-changelog-report.txt ]; then
            cp _report/vulnlog-changelog-report.txt _site/security-changelog.txt
          else
            echo "Skipping changelog report bundle (no artifact downloaded)."
          fi
          sed "s|^VERSION=\".*\"|VERSION=\"${VERSION}\"|" \
              install/install.sh.template > _site/install
          cp install/uninstall.sh.template _site/uninstall
          sed -i "s/VULNLOG_VERSION/${VERSION}/g" _site/index.html
      - name: Upload site to Bunny Storage
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_ACCESS_KEY }}
          BUNNY_STORAGE_ZONE_REGION_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ZONE_REGION_ENDPOINT }}
        working-directory: _site
        run: |
          set -euo pipefail
          endpoint="${BUNNY_STORAGE_ZONE_REGION_ENDPOINT%/}"
          find . -type f -print0 | while IFS= read -r -d '' file; do
            path="${file#./}"
            echo "Uploading ${path}"
            curl --silent --show-error --fail-with-body \
              --header "AccessKey: ${BUNNY_ACCESS_KEY}" \
              --upload-file "${file}" \
              "${endpoint}/${path}"
            echo
          done
