name: Deploy website and docs

# Single implementation of the website deploy. Invoked four ways:
# - workflow_call from release.yaml on final release tags
# - workflow_dispatch for manual deploys from main
# - workflow_run after the weekly security scan, to refresh the bundled reports
# - push to main changing .vex/, so updated VEX documents go live without waiting for the next scan

on:
  push:
    branches: [main]
    paths: ['.vex/**']
  workflow_call:
    inputs:
      version:
        description: "Version of the release the site shows. Defaults to the highest final version tag."
        type: string
        default: ''
  workflow_dispatch:
  # Safe here: Security Scanning runs only on schedule and dispatch, never on pull requests, so the
  # downloaded reports never come from untrusted code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Security Scanning"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds `BUNNY_ACCESS_KEY` and `BUNNY_STORAGE_ZONE_REGION_ENDPOINT` and allows only `main` and version tags.
    environment:
      name: website
      url: https://vulnlog.dev
    concurrency:
      group: website
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve the latest release
        id: release
        env:
          VERSION_INPUT: ${{ inputs.version }}
        # Without an input, the same rule as the `version` job of `release.yaml`: the highest final version tag.
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            TAG=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::No final version tag found."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=release/${VERSION%.*}" >> "$GITHUB_OUTPUT"
      # `main` may already hold the website and schema changes of the next release.
      # The docs come from the release branches too (`antora-playbook.yml`). `.vex/` stays as checked out.
      - name: Take the site sources from the release branch
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: git restore --source="origin/${BRANCH}" -- website schema
      # The release pipeline renders them, so the site serves the files that `SHA256SUMS` lists.
      - name: Download the install scripts of the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --dir _release \
            --pattern install-vulnlog.sh --pattern uninstall-vulnlog.sh
      - name: Build docs
        uses: ./.github/actions/build-docs
      - name: Resolve security report run id
        id: report-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            echo "run-id=${TRIGGER_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow=security.yml \
            --status=success \
            --branch=main \
            --limit=1 \
            --json databaseId \
            -q '.[0].databaseId' || true)
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful security run found; skipping report bundle."
            echo "run-id=" >> "$GITHUB_OUTPUT"
          else
            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          fi
      - name: Download latest security reports
        if: steps.report-run.outputs.run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports
          path: _report
          run-id: ${{ steps.report-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose site
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p _site/docs _site/schema _site/vex
          cp -r website/. _site/
          cp -r build/docs/* _site/docs/
          # Also served at /docs, where the relative redirect would resolve against /.
          sed -i 's|<meta charset="utf-8">|&<base href="/docs/">|' _site/docs/index.html
          cp schema/*.json _site/schema/
          cp .vex/*.json _site/vex/
          if [ -f _report/vulnlog-impact-report.html ]; then
            cp _report/vulnlog-impact-report.html _site/security-report.html
          else
            echo "Skipping impact report bundle (no artifact downloaded)."
          fi
          if [ -f _report/vulnlog-changelog-report.txt ]; then
            cp _report/vulnlog-changelog-report.txt _site/security-changelog.txt
          else
            echo "Skipping changelog report bundle (no artifact downloaded)."
          fi
          cp _release/install-vulnlog.sh _site/install
          cp _release/uninstall-vulnlog.sh _site/uninstall
          sed -i "s/VULNLOG_VERSION/${VERSION}/g" _site/index.html
      - name: Upload site to Bunny Storage
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_ACCESS_KEY }}
          BUNNY_STORAGE_ZONE_REGION_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ZONE_REGION_ENDPOINT }}
        working-directory: _site
        run: |
          set -euo pipefail
          : "${BUNNY_ACCESS_KEY:?secret BUNNY_ACCESS_KEY is empty}"
          : "${BUNNY_STORAGE_ZONE_REGION_ENDPOINT:?secret BUNNY_STORAGE_ZONE_REGION_ENDPOINT is empty}"
          endpoint="${BUNNY_STORAGE_ZONE_REGION_ENDPOINT%/}"
          find . -type f -print0 | while IFS= read -r -d '' file; do
            path="${file#./}"
            echo "Uploading ${path}"
            curl --silent --show-error --fail-with-body \
              --header "AccessKey: ${BUNNY_ACCESS_KEY}" \
              --upload-file "${file}" \
              "${endpoint}/${path}"
            echo
          done
