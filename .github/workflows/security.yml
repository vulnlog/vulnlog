name: Security Scanning

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VULNLOG_VERSION: "0.17.0"

jobs:
  vulnlog:
    name: Generate Vulnlog files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Vulnlog CLI
        uses: vulnlog/setup-vulnlog@v1
        with:
          version: ${{ env.VULNLOG_VERSION }}

      - name: Generate suppression files
        run: vulnlog suppress vulnlog.yaml

      - name: Ensure suppression files exist
        run: |
          [ -f .snyk ] || touch .snyk
          [ -f .trivyignore.yaml ] || touch .trivyignore.yaml

      - name: Upload suppression files
        uses: actions/upload-artifact@v7
        with:
          name: suppressions
          include-hidden-files: true
          path: |
            .snyk
            .trivyignore.yaml

      - name: Generate impact report
        run: vulnlog report impact vulnlog.yaml

      - name: Generate changelog report
        run: vulnlog report changelog vulnlog.yaml --output vulnlog-changelog-report.txt

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            vulnlog-impact-report.html
            vulnlog-changelog-report.txt

  artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JVM toolchain
        uses: ./.github/actions/setup-jvm

      # A fixed version keeps the shadowJar file name predictable.
      - name: Build CLI distribution and Gradle plugin
        run: ./gradlew :cli-app:installDist :gradle-plugin:shadowJar -PappVersion=scan

      - name: Stage artifacts
        run: |
          mkdir -p release-artifacts/cli release-artifacts/gradle-plugin
          cp modules/cli-app/build/install/vulnlog/lib/*.jar release-artifacts/cli/
          cp modules/gradle-plugin/build/libs/gradle-plugin-scan.jar release-artifacts/gradle-plugin/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts

  snyk:
    name: Snyk Open Source
    needs: [ vulnlog ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download suppression files
        uses: actions/download-artifact@v8
        with:
          name: suppressions

      # Exit 1 only means "vulnerabilities found"; a real failure writes no SARIF.
      # configuration-matching narrows the scan to what ships.
      # The inner quotes matter: the action entrypoint evals the argument string.
      - name: Run Snyk
        id: snyk
        uses: snyk/actions/gradle@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_API_KEY }}
        with:
          args: --sarif-file-output=snyk-results.sarif --policy-path=.snyk --all-sub-projects --configuration-matching='^(runtimeClasspath|shaded)$' --severity-threshold=medium

      - name: Verify Snyk produced a report
        run: |
          if [ ! -s snyk-results.sarif ]; then
            echo "::error::Snyk wrote no SARIF (outcome: ${{ steps.snyk.outcome }}); the scan errored out."
            exit 1
          fi

      # One SARIF run per sub-project, each already labelled by Snyk. Those
      # labels are the categories, and code scanning rejects the upload if two
      # runs share one, so leave them alone: a `category` here would be ignored.
      - name: Upload Snyk SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: snyk-results.sarif

  trivy:
    name: Trivy Release Artifacts
    needs: [ vulnlog, artifacts ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download suppression files
        uses: actions/download-artifact@v8
        with:
          name: suppressions

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts

      # rootfs, not fs: the fs scanner never looks inside jars.
      - name: Run Trivy artifact scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: release-artifacts
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore.yaml
          severity: 'CRITICAL,HIGH,MEDIUM'
          # SARIF output ignores `severity` without this.
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  trivy-image:
    name: Trivy Container Image
    needs: [ vulnlog ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download suppression files
        uses: actions/download-artifact@v8
        with:
          name: suppressions

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:${{ env.VULNLOG_VERSION }}
          format: sarif
          output: trivy-image-results.sarif
          trivyignores: .trivyignore.yaml
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          # The Debian base carries many CVEs Debian has not fixed.
          ignore-unfixed: true

      - name: Upload Trivy image SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
