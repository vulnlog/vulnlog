name: Security Scanning

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VULNLOG_VERSION: "0.16.0"

jobs:
  vulnlog:
    name: Generate Vulnlog files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate suppression files
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/work" \
            "ghcr.io/${{ github.repository }}:${VULNLOG_VERSION}" \
            suppress vulnlog.yaml --output-dir /work

      - name: Ensure suppression files exist
        run: |
          [ -f .snyk ] || touch .snyk
          [ -f .trivyignore.yaml ] || touch .trivyignore.yaml

      - name: Upload suppression files
        uses: actions/upload-artifact@v7
        with:
          name: suppressions
          include-hidden-files: true
          path: |
            .snyk
            .trivyignore.yaml

      - name: Generate HTML report
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/work" \
            "ghcr.io/${{ github.repository }}:${VULNLOG_VERSION}" \
            report vulnlog.yaml

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: vulnlog-report.html

  snyk:
    name: Snyk Open Source
    needs: [ vulnlog ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download suppression files
        uses: actions/download-artifact@v8
        with:
          name: suppressions

      # Exit 1 only means "vulnerabilities found"; real errors are caught below.
      - name: Run Snyk
        id: snyk
        uses: snyk/actions/gradle@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_API_KEY }}
        with:
          args: --sarif-file-output=snyk-results.sarif --policy-path=.snyk --all-sub-projects --severity-threshold=medium

      - name: Verify Snyk produced a report
        run: |
          if [ ! -s snyk-results.sarif ]; then
            echo "::error::Snyk wrote no SARIF (outcome: ${{ steps.snyk.outcome }}); the scan errored out."
            exit 1
          fi

      # upload-sarif honours `category` only when the SARIF carries no
      # automationDetails. Snyk indexes its own by build position, so adding or
      # removing a module reshuffles it and orphans the old category.
      - name: Normalise SARIF category
        run: |
          jq 'del(.runs[].automationDetails)' snyk-results.sarif > snyk-results.normalised.sarif
          mv snyk-results.normalised.sarif snyk-results.sarif

      - name: Upload Snyk SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: snyk-results.sarif
          category: snyk

  trivy:
    name: Trivy Vulnerability Scan
    needs: [ vulnlog ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download suppression files
        uses: actions/download-artifact@v8
        with:
          name: suppressions

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore.yaml
          severity: 'CRITICAL,HIGH,MEDIUM'
          # SARIF output ignores `severity` without this.
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy
