name: Dependency graph

# GitHub doesn't read Gradle builds by itself. The submitted graph feeds the dependency graph
# and the Dependabot alerts of the Gradle dependencies.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  submit-gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The dependency submission API needs it.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not `setup-jvm`, because `dependency-submission` sets up Gradle itself. Same Java as in `setup-jvm`.
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Submit the Gradle dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
