name: Set up JVM toolchain
description: Set up Java 21 Temurin and Gradle for building.

runs:
  using: composite
  steps:
    # Runs Gradle only. The build compiles with the Java 25 toolchain set in
    # `vulnlog.common-convention.gradle.kts`, which Gradle finds on the runner or downloads.
    - name: Set up Java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
