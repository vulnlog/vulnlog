site:
  title: Vulnlog Documentation
  url: https://vulnlog.dev/docs
  start_page: vulnlog::index.adoc

content:
  sources:
    - url: .
      branches:
        - release/0.18
        - release/0.17
        - release/0.16
        - release/0.15
        - release/0.14
      start_path: docs

urls:
  latest_version_segment: latest
  latest_version_segment_strategy: redirect:from

asciidoc:
  attributes:
    # Previous and next page links at the bottom of each page, in navigation order.
    # The @ lets a component turn them off with page-pagination: false.
    page-pagination: '@'

antora:
  extensions:
    # Full-text search in the browser. The index is a static file written at build time.
    - require: '@antora/lunr-extension'
      # Only the latest version is indexed, so results don't repeat for every release line.
      index_latest_only: true

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./docs/supplemental-ui

output:
  dir: ./build/docs
